<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Runner — AI501 GenAIOps Enablement Fast Forward 🏃‍♀️💨</title>
<style>
:root {
  --bg: #1a1a2e;
  --bg-card: #16213e;
  --bg-input: #0f3460;
  --accent: #e94560;
  --accent-hover: #ff6b81;
  --green: #2ecc71;
  --yellow: #f39c12;
  --red: #e74c3c;
  --dim: #7f8c8d;
  --text: #ecf0f1;
  --text-muted: #95a5a6;
  --border: #2c3e50;
  --radius: 8px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Red Hat Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
}

header {
  background: linear-gradient(135deg, var(--bg-card), var(--bg-input));
  border-bottom: 2px solid var(--accent);
  padding: 1rem 2rem;
  display: flex;
  align-items: center;
  gap: 1rem;
}

header h1 {
  font-size: 1.4rem;
  font-weight: 600;
}

header h1 span { color: var(--accent); }

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 1.5rem;
}

/* Connection Panel */
.panel {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.25rem;
  margin-bottom: 1.5rem;
}

.panel-title {
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  margin-bottom: 0.75rem;
}

.form-row {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  align-items: flex-end;
}

.form-group {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 180px;
}

.form-group label {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-bottom: 0.25rem;
}

input, select {
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  padding: 0.5rem 0.75rem;
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.2s;
}

input:focus, select:focus {
  border-color: var(--accent);
}

button {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 4px;
  padding: 0.5rem 1.25rem;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.2s;
  white-space: nowrap;
}

button:hover:not(:disabled) { background: var(--accent-hover); }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-secondary {
  background: var(--border);
}

.btn-secondary:hover:not(:disabled) { background: var(--dim); }

/* Module Grid */
.module-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 0.75rem;
}

.module-card {
  background: var(--bg-input);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 0.75rem;
  cursor: pointer;
  transition: border-color 0.2s, transform 0.1s;
  user-select: none;
}

.module-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.module-card.selected { border-color: var(--accent); background: rgba(233, 69, 96, 0.1); }
.module-card.status-complete { border-left: 4px solid var(--green); }
.module-card.status-partial { border-left: 4px solid var(--yellow); }
.module-card.status-not_started { border-left: 4px solid var(--dim); }

.module-id {
  font-size: 0.7rem;
  color: var(--accent);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.module-name {
  font-size: 0.95rem;
  font-weight: 600;
  margin: 0.15rem 0;
}

.module-deps {
  font-size: 0.7rem;
  color: var(--text-muted);
}

.module-status-text {
  font-size: 0.7rem;
  margin-top: 0.25rem;
  font-weight: 600;
}

.module-status-text.complete { color: var(--green); }
.module-status-text.partial { color: var(--yellow); }
.module-status-text.not_started { color: var(--dim); }

/* Action Bar */
.action-bar {
  display: flex;
  gap: 0.75rem;
  align-items: center;
  flex-wrap: wrap;
  margin-top: 1rem;
}

.action-bar .hint {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-left: auto;
}

/* Progress Panel */
#progress-panel {
  display: none;
}

#progress-panel.active {
  display: block;
}

.progress-overall {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.progress-bar-track {
  flex: 1;
  height: 8px;
  background: var(--bg-input);
  border-radius: 4px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 4px;
  transition: width 0.3s;
  width: 0%;
}

.progress-bar-fill.done { background: var(--green); }

.progress-text {
  font-size: 0.8rem;
  color: var(--text-muted);
  min-width: 3rem;
  text-align: right;
}

.module-progress {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 0.5rem;
  overflow: hidden;
}

.module-progress-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 0.75rem;
  background: var(--bg-input);
  cursor: pointer;
  font-size: 0.9rem;
}

.module-progress-header .icon {
  width: 1.2rem;
  text-align: center;
}

.module-progress-body {
  padding: 0 0.75rem 0.5rem;
  display: none;
}

.module-progress.expanded .module-progress-body {
  display: block;
}

.step-line {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.25rem 0;
  font-size: 0.8rem;
}

.step-line .icon { width: 1rem; text-align: center; }
.step-line .desc { flex: 1; }
.step-line.success .icon { color: var(--green); }
.step-line.skipped { color: var(--dim); }
.step-line.failed .icon { color: var(--red); }
.step-line.running .icon { color: var(--yellow); }

.error-detail {
  background: rgba(231, 76, 60, 0.1);
  border: 1px solid var(--red);
  border-radius: 4px;
  padding: 0.5rem;
  margin-top: 0.25rem;
  font-size: 0.75rem;
  color: var(--red);
  white-space: pre-wrap;
  word-break: break-word;
}

.complete-banner {
  padding: 1rem;
  border-radius: var(--radius);
  text-align: center;
  font-weight: 600;
  margin-top: 0.5rem;
}

.complete-banner.success { background: rgba(46, 204, 113, 0.15); color: var(--green); }
.complete-banner.failure { background: rgba(231, 76, 60, 0.15); color: var(--red); }

@keyframes spin {
  to { transform: rotate(360deg); }
}

.spinner {
  display: inline-block;
  width: 0.8rem;
  height: 0.8rem;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}

/* Status Table */
#status-panel { display: none; }
#status-panel.active { display: block; }

.status-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
}

.status-table th {
  text-align: left;
  padding: 0.5rem;
  border-bottom: 2px solid var(--border);
  color: var(--text-muted);
  font-size: 0.75rem;
  text-transform: uppercase;
}

.status-table td {
  padding: 0.5rem;
  border-bottom: 1px solid var(--border);
}

@media (max-width: 600px) {
  .form-row { flex-direction: column; }
  .form-group { min-width: unset; }
  .module-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<header>
  <h1>Lab Runner — <span>AI501 GenAIOps Enablement Fast Forward 🏃‍♀️💨</span></h1>
</header>

<div class="container">
  <!-- Connection Panel -->
  <div class="panel">
    <div class="panel-title">Connection</div>
    <div class="form-row">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="user1">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Password">
      </div>
      <div class="form-group">
        <label for="cluster-domain">Cluster Domain</label>
        <input type="text" id="cluster-domain" placeholder="apps.cluster.example.com">
      </div>
      <button id="btn-status" class="btn-secondary" onclick="checkStatus()">Check Status</button>
    </div>
    <p style="font-size:0.75rem;color:var(--text-muted);margin-top:0.5rem">Status check will go through all the exercises to verify the state of your user. This may take a couple of minutes.</p>
  </div>

  <!-- Status Panel -->
  <div id="status-panel" class="panel">
    <div class="panel-title">Cluster Status</div>
    <table class="status-table">
      <thead>
        <tr><th>Module</th><th>Name</th><th>Status</th><th>Steps</th></tr>
      </thead>
      <tbody id="status-body"></tbody>
    </table>
  </div>

  <!-- Module Selection -->
  <div class="panel">
    <div class="panel-title">Modules</div>
    <div class="module-grid" id="module-grid"></div>
    <div class="action-bar">
      <label for="up-to" style="font-size:0.8rem;color:var(--text-muted)">Select up to:</label>
      <select id="up-to" onchange="selectUpTo()">
        <option value="">-- pick modules --</option>
      </select>
      <button id="btn-run" onclick="runModules()">Run Selected</button>
      <button id="btn-cancel" class="btn-secondary" onclick="cancelRun()" style="display:none">Cancel</button>
      <span class="hint" id="selected-count">0 selected</span>
    </div>
  </div>

  <!-- Progress Panel -->
  <div id="progress-panel" class="panel">
    <div class="panel-title">Progress</div>
    <div class="progress-overall">
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <span class="progress-text" id="progress-text">0%</span>
    </div>
    <div id="progress-modules"></div>
    <div id="complete-banner"></div>
  </div>
</div>

<script>
let modules = [];
let selectedModules = new Set();
let abortController = null;

async function loadModules() {
  const resp = await fetch('/api/modules');
  modules = await resp.json();
  renderModules();
  renderUpToDropdown();
}

function renderModules() {
  const grid = document.getElementById('module-grid');
  grid.innerHTML = '';
  for (const m of modules) {
    const card = document.createElement('div');
    card.className = 'module-card' + (selectedModules.has(m.id) ? ' selected' : '');
    card.dataset.id = m.id;
    card.onclick = () => toggleModule(m.id);

    const deps = m.dependencies.length
      ? 'Requires: ' + m.dependencies.map(d => {
          const dep = modules.find(x => x.id === d);
          return dep ? dep.name : `Module ${d}`;
        }).join(', ')
      : 'No dependencies';

    card.innerHTML = `
      <div class="module-id">Module ${m.id}</div>
      <div class="module-name">${m.name}</div>
      <div class="module-deps">${deps}</div>
    `;
    grid.appendChild(card);
  }
}

function renderUpToDropdown() {
  const sel = document.getElementById('up-to');
  for (const m of modules) {
    const opt = document.createElement('option');
    opt.value = m.id;
    opt.textContent = `Module ${m.id}: ${m.name}`;
    sel.appendChild(opt);
  }
}

function toggleModule(id) {
  if (selectedModules.has(id)) selectedModules.delete(id);
  else selectedModules.add(id);
  renderModules();
  updateSelectedCount();
}

function selectUpTo() {
  const val = parseInt(document.getElementById('up-to').value);
  if (!val) return;
  selectedModules.clear();
  for (const m of modules) {
    if (m.id <= val) selectedModules.add(m.id);
  }
  renderModules();
  updateSelectedCount();
}

function updateSelectedCount() {
  document.getElementById('selected-count').textContent =
    `${selectedModules.size} selected`;
}

function getCredentials() {
  return {
    username: document.getElementById('username').value.trim(),
    password: document.getElementById('password').value,
    cluster_domain: document.getElementById('cluster-domain').value.trim(),
  };
}

function validateCredentials(creds) {
  if (!creds.username || !creds.password || !creds.cluster_domain) {
    alert('Please fill in all connection fields.');
    return false;
  }
  return true;
}

async function checkStatus() {
  const creds = getCredentials();
  if (!validateCredentials(creds)) return;

  const btn = document.getElementById('btn-status');
  btn.disabled = true;
  btn.textContent = 'Checking...';

  try {
    const resp = await fetch('/api/status', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(creds),
    });
    const data = await resp.json();

    const tbody = document.getElementById('status-body');
    tbody.innerHTML = '';
    for (const s of data) {
      const statusClass = s.status;
      const statusLabel = s.status === 'complete' ? 'Complete'
        : s.status === 'partial' ? 'Partial' : 'Not started';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="color:var(--accent);font-weight:600">${s.module_id}</td>
        <td>${s.name}</td>
        <td class="module-status-text ${statusClass}">${statusLabel}</td>
        <td>${s.steps_passed}/${s.steps_total}</td>
      `;
      tbody.appendChild(tr);
    }
    document.getElementById('status-panel').classList.add('active');

    // Update module cards with status
    for (const s of data) {
      const card = document.querySelector(`.module-card[data-id="${s.id || s.module_id}"]`);
      if (card) {
        card.classList.remove('status-complete', 'status-partial', 'status-not_started');
        card.classList.add(`status-${s.status}`);
        let statusEl = card.querySelector('.module-status-text');
        if (!statusEl) {
          statusEl = document.createElement('div');
          statusEl.className = 'module-status-text';
          card.appendChild(statusEl);
        }
        const label = s.status === 'complete' ? 'Complete'
          : s.status === 'partial' ? 'Partial' : 'Not started';
        statusEl.className = `module-status-text ${s.status}`;
        statusEl.textContent = `${label} (${s.steps_passed}/${s.steps_total})`;
      }
    }
  } catch (e) {
    alert('Status check failed: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Check Status';
  }
}

async function runModules() {
  if (selectedModules.size === 0) {
    alert('Select at least one module.');
    return;
  }
  const creds = getCredentials();
  if (!validateCredentials(creds)) return;

  const btnRun = document.getElementById('btn-run');
  const btnCancel = document.getElementById('btn-cancel');
  btnRun.disabled = true;
  btnCancel.style.display = 'inline-block';

  const progressPanel = document.getElementById('progress-panel');
  const progressModules = document.getElementById('progress-modules');
  const completeBanner = document.getElementById('complete-banner');
  progressModules.innerHTML = '';
  completeBanner.innerHTML = '';
  progressPanel.classList.add('active');

  const fill = document.getElementById('progress-fill');
  const ptext = document.getElementById('progress-text');
  fill.style.width = '0%';
  fill.classList.remove('done');
  ptext.textContent = '0%';

  let totalModules = selectedModules.size;
  let doneModules = 0;
  let currentModuleEl = null;
  let currentBodyEl = null;

  abortController = new AbortController();

  try {
    const resp = await fetch('/api/run', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        ...creds,
        modules: Array.from(selectedModules),
      }),
      signal: abortController.signal,
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const {value, done} = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const event = JSON.parse(line.slice(6));

        if (event.type === 'module_start') {
          totalModules = Math.max(totalModules, selectedModules.size);
          const el = document.createElement('div');
          el.className = 'module-progress expanded';
          el.innerHTML = `
            <div class="module-progress-header" onclick="this.parentElement.classList.toggle('expanded')">
              <span class="icon"><span class="spinner"></span></span>
              <strong>Module ${event.module_id}: ${event.module_name}</strong>
              <span style="margin-left:auto;font-size:0.75rem;color:var(--text-muted)">
                0/${event.total_steps} steps
              </span>
            </div>
            <div class="module-progress-body"></div>
          `;
          progressModules.appendChild(el);
          currentModuleEl = el;
          currentBodyEl = el.querySelector('.module-progress-body');
          // Collapse previous modules
          for (const prev of progressModules.querySelectorAll('.module-progress')) {
            if (prev !== el) prev.classList.remove('expanded');
          }
        }

        else if (event.type === 'step_start') {
          const step = document.createElement('div');
          step.className = 'step-line running';
          step.id = `step-${event.step}`;
          step.innerHTML = `
            <span class="icon"><span class="spinner"></span></span>
            <span class="desc">[${event.step}/${event.total}] ${event.description}</span>
          `;
          currentBodyEl.appendChild(step);
        }

        else if (event.type === 'step_done') {
          let stepEl = currentBodyEl.querySelector(`#step-${event.step}`);
          if (!stepEl) {
            stepEl = document.createElement('div');
            stepEl.id = `step-${event.step}`;
            currentBodyEl.appendChild(stepEl);
          }
          const icon = event.status === 'success' ? '&#10003;'
            : event.status === 'skipped' ? '&#8212;' : '?';
          stepEl.className = `step-line ${event.status}`;
          stepEl.innerHTML = `
            <span class="icon">${icon}</span>
            <span class="desc">[${event.step}/${event.total}] ${event.description}${event.status === 'skipped' ? ' — skipped' : ''}</span>
          `;
          // Update step counter in header
          if (currentModuleEl) {
            const doneSteps = currentBodyEl.querySelectorAll('.step-line.success, .step-line.skipped').length;
            const counter = currentModuleEl.querySelector('.module-progress-header span:last-child');
            if (counter) counter.textContent = `${doneSteps}/${event.total} steps`;
          }
        }

        else if (event.type === 'error') {
          let stepEl = currentBodyEl.querySelector(`#step-${event.step}`);
          if (!stepEl) {
            stepEl = document.createElement('div');
            stepEl.id = `step-${event.step || 'err'}`;
            currentBodyEl.appendChild(stepEl);
          }
          stepEl.className = 'step-line failed';
          const stepLabel = event.step ? `[${event.step}/${event.total}] ` : '';
          stepEl.innerHTML = `
            <span class="icon">&#10007;</span>
            <span class="desc">${stepLabel}${event.description || event.message}</span>
          `;
          if (event.message || event.output) {
            const detail = document.createElement('div');
            detail.className = 'error-detail';
            detail.textContent = event.message + (event.output ? '\n' + event.output : '');
            stepEl.appendChild(detail);
          }
        }

        else if (event.type === 'module_done') {
          doneModules++;
          const pct = Math.round((doneModules / totalModules) * 100);
          fill.style.width = pct + '%';
          ptext.textContent = pct + '%';

          if (currentModuleEl) {
            const headerIcon = currentModuleEl.querySelector('.module-progress-header .icon');
            if (event.status === 'success') {
              headerIcon.innerHTML = '<span style="color:var(--green)">&#10003;</span>';
            } else {
              headerIcon.innerHTML = '<span style="color:var(--red)">&#10007;</span>';
            }
          }
        }

        else if (event.type === 'complete') {
          if (event.success) {
            fill.style.width = '100%';
            fill.classList.add('done');
            ptext.textContent = '100%';
            completeBanner.className = 'complete-banner success';
            completeBanner.textContent = 'All modules completed successfully.';
          } else {
            completeBanner.className = 'complete-banner failure';
            completeBanner.textContent = 'Execution stopped due to an error.';
          }
        }
      }
    }
  } catch (e) {
    if (e.name === 'AbortError') {
      completeBanner.className = 'complete-banner failure';
      completeBanner.textContent = 'Run cancelled.';
    } else {
      completeBanner.className = 'complete-banner failure';
      completeBanner.textContent = 'Connection error: ' + e.message;
    }
  } finally {
    btnRun.disabled = false;
    btnCancel.style.display = 'none';
    abortController = null;
  }
}

function cancelRun() {
  if (abortController) abortController.abort();
}

loadModules();
</script>
</body>
</html>
