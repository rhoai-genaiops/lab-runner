[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-runner"
version = "0.1.0"
description = "Automated exercise verification tool for GenAIOps Enablement (AI501)"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "gitpython>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
]

[project.scripts]
lab-runner = "lab_runner.cli:cli"
lab-runner-web = "lab_runner.web:serve"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
lab_runner = ["templates/*.html"]
